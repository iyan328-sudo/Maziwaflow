name: Build Android APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Locate Project and Build
        run: |
          echo "Scanning repository structure..."
          find . -maxdepth 3 -not -path '*/.*'
          
          # Search for gradlew anywhere in the repo
          GRADLE_PATH=$(find . -name "gradlew" -type f -print -quit)
          
          if [ -n "$GRADLE_PATH" ]; then
            DIR=$(dirname "$GRADLE_PATH")
            echo "Found gradlew in: $DIR"
            cd "$DIR"
          else
            echo "gradlew not found, searching for build.gradle..."
            BUILD_PATH=$(find . \( -name "build.gradle" -o -name "build.gradle.kts" \) -type f -print -quit)
            if [ -n "$BUILD_PATH" ]; then
              DIR=$(dirname "$BUILD_PATH")
              echo "Found build.gradle in: $DIR. Generating Gradle wrapper..."
              cd "$DIR"
              gradle wrapper
            else
              echo "Error: Could not locate any Android project files."
              exit 1
            fi
          fi
          
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: maziwaflow-debug-apk
          path: '**/app/build/outputs/apk/debug/*.apk'
