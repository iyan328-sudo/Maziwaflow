name: Build Android APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Grant execute permission for gradlew
        run: chmod +x "Maziwaflow mobile app/gradlew"

      - name: Build Debug APK
        run: cd "Maziwaflow mobile app" && ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: maziwaflow-debug-apk
          path: "Maziwaflow mobile app/app/build/outputs/apk/debug/*.apk"
