name: Build and deploy Maziwaflow

on:
  push:
    branches:
      - main
      - master
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'Maziwaflow  mobile app/package-lock.json'

      - name: Install dependencies
        working-directory: "Maziwaflow  mobile app"
        run: npm ci

      - name: Build web app
        working-directory: "Maziwaflow  mobile app"
        run: npm run build

      - name: Deploy to Cloudflare Workers
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --config .output/server/wrangler.json
          workingDirectory: "Maziwaflow  mobile app"