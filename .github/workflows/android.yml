name: Build Android APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Find and build with Gradle
        run: |
          # Find the gradlew file inside any subdirectory if needed
          GRADLE_W=$(find . -name "gradlew" -type f)
          DIR=$(dirname "$GRADLE_W")
          echo "Found gradlew in: $DIR"
          cd "$DIR"
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: maziwaflow-debug-apk
          path: '**/app/build/outputs/apk/debug/*.apk'
