name: Deploy to GitHub Pages

"on":
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: "Maziwaflow  mobile app/package-lock.json"
      - run: npm ci
        working-directory: "Maziwaflow  mobile app"
      - name: Set Pages base path
        run: echo "VITE_BASE_PATH=/${GITHUB_REPOSITORY#*/}/" >> "$GITHUB_ENV"
      - run: npm run build
        working-directory: "Maziwaflow  mobile app"
      - name: Prepare static site
        working-directory: "Maziwaflow  mobile app"
        run: |
          echo "=== Contents of .output/public/ ==="
          ls -la .output/public/ || true
          # Locate the shell HTML — TanStack Start may emit _shell.html or index.html depending on version
          if [ -f .output/public/_shell.html ]; then
            SHELL_FILE=".output/public/_shell.html"
          elif [ -f .output/public/index.html ]; then
            SHELL_FILE=".output/public/index.html"
          else
            echo "ERROR: No shell HTML found. HTML files present:"
            find .output/public -name "*.html" | head -20
            exit 1
          fi
          echo "Using shell file: $SHELL_FILE"
          cp "$SHELL_FILE" .output/public/index.html
          cp "$SHELL_FILE" .output/public/404.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: "Maziwaflow  mobile app/.output/public"

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
