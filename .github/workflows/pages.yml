name: Deploy to GitHub Pages

"on":
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: "Maziwaflow  mobile app/package-lock.json"
      - run: npm ci
        working-directory: "Maziwaflow  mobile app"
      - name: Set Pages base path
        run: echo "VITE_BASE_PATH=/${GITHUB_REPOSITORY#*/}/" >> "$GITHUB_ENV"
      - run: npm run build
        working-directory: "Maziwaflow  mobile app"
      - name: Prepare static site
        run: cp .output/public/_shell.html .output/public/index.html && cp .output/public/_shell.html .output/public/404.html
        working-directory: "Maziwaflow  mobile app"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: "Maziwaflow  mobile app/.output/public"

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
