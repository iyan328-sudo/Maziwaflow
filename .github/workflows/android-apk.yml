name: Build Android APK

"on":
  workflow_dispatch:
    inputs:
      app_url:
        description: Deployed Maziwaflow app URL to load in the Android app
        required: true
        type: string
        default: https://maziwaflow-app.pages.dev
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      CAPACITOR_SERVER_URL: ${{ inputs.app_url || vars.CAPACITOR_SERVER_URL || 'https://maziwaflow-app.pages.dev' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: "Maziwaflow  mobile app/package-lock.json"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - run: npm ci
        working-directory: "Maziwaflow  mobile app"
      - run: npm run build
        working-directory: "Maziwaflow  mobile app"
      - name: Validate deployed app URL
        run: |
          case "$CAPACITOR_SERVER_URL" in
            https://*) ;;
            *) echo "::error::CAPACITOR_SERVER_URL must be an HTTPS URL."; exit 1 ;;
          esac
        working-directory: "Maziwaflow  mobile app"
      - name: Sync Android project
        run: npx cap sync android
        working-directory: "Maziwaflow  mobile app"
      - name: Build debug APK
        run: ./gradlew assembleDebug
        working-directory: "Maziwaflow  mobile app/android"
      - uses: actions/upload-artifact@v4
        with:
          name: maziwaflow-android-apk
          path: "Maziwaflow  mobile app/android/app/build/outputs/apk/debug/app-debug.apk"
      - name: Attach APK to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: "Maziwaflow  mobile app/android/app/build/outputs/apk/debug/app-debug.apk"
