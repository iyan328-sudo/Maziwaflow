name: Build Android APK

"on":
  workflow_dispatch:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: "Maziwaflow  mobile app/package-lock.json"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - run: npm ci
        working-directory: "Maziwaflow  mobile app"
      - run: npm run build
        working-directory: "Maziwaflow  mobile app"
      - name: Prepare app entry point
        run: cp .output/public/_shell.html .output/public/index.html
        working-directory: "Maziwaflow  mobile app"
      - name: Generate Android project
        run: npx cap add android
        working-directory: "Maziwaflow  mobile app"
      - run: npx cap sync android
        working-directory: "Maziwaflow  mobile app"
      - name: Build debug APK
        run: ./gradlew assembleDebug
        working-directory: "Maziwaflow  mobile app/android"
      - uses: actions/upload-artifact@v4
        with:
          name: maziwaflow-android-apk
          path: "Maziwaflow  mobile app/android/app/build/outputs/apk/debug/app-debug.apk"
      - name: Attach APK to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: "Maziwaflow  mobile app/android/app/build/outputs/apk/debug/app-debug.apk"
